name: 입찰공고 수집

on:
  schedule:
    # 평일 08:00 KST = 전날 23:00 UTC (KST = UTC+9)
    # 일~목 23:00 UTC → 월~금 08:00 KST
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간(일). 비우면 자동 계산 — 평일 2일, 월요일만 4일"
        required: false
        default: ""
      mode:
        description: "keyword(검색어별 호출) 또는 full(기간 전체 스캔)"
        required: false
        default: "keyword"
        type: choice
        options: [keyword, full]
      dry_run:
        description: "Notion 에 쓰지 않고 결과만 확인"
        required: false
        default: false
        type: boolean

concurrency:
  group: g2b-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    # 대부분의 GitHub 호스티드 러너에서 조달청 API 에 정상 도달한다. 다만 러너에 따라
    # 연결이 안 되는 날이 관측됐다(README 5절의 실측 기록). 국내 self-hosted 러너를
    # 붙였다면 저장소 변수 RUNNER_LABEL 에 그 라벨(예: self-hosted)을 넣으면 이쪽으로 돈다.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # Secrets 가 아직 등록되지 않은 상태에서 cron 이 돌면 매일 아침 CI 가 빨갛게 실패한다.
      # 스케줄 실행은 경고만 남기고 건너뛰고, 사람이 직접 돌린 실행은 명확히 실패시킨다.
      - name: Secrets 등록 여부 확인
        id: preflight
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          missing=""
          [ -n "$G2B_SERVICE_KEY" ]   || missing="$missing G2B_SERVICE_KEY"
          [ -n "$NOTION_TOKEN" ]      || missing="$missing NOTION_TOKEN"
          [ -n "$NOTION_DATABASE_ID" ]|| missing="$missing NOTION_DATABASE_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="등록되지 않은 Secret:$missing — Settings → Secrets and variables → Actions 에서 등록하세요. README 2절 참고."
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning title=수집 건너뜀::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Secrets 미등록::$msg"
            exit 1
          fi

      # 스케줄은 월~금(KST)만 돈다. 조회창이 늘 2일이면 금요일 08:00 이후 게시된 공고가
      # 어느 실행에도 잡히지 않는다 — 근거와 월요일만 창을 넓히는 이유는 cli.lookback_days
      # 의 주석에 적어 뒀고, 빈 구간이 생기지 않는지는 테스트로 지킨다.
      - name: 조회 기간 결정
        id: window
        env:
          PYTHONPATH: src
        run: |
          days="${{ inputs.days }}"
          [ -n "$days" ] || days="$(python -m g2b_watch.cli lookback-days)"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "조회 기간: 최근 ${days}일 (KST $(TZ=Asia/Seoul date '+%Y-%m-%d %a %H:%M'))" >> "$GITHUB_STEP_SUMMARY"

      - name: 수집 및 Notion 적재
        if: steps.preflight.outputs.ready == 'true'
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PYTHONPATH: src
        run: |
          python -m g2b_watch.cli collect \
            --days "${{ steps.window.outputs.days }}" \
            --mode "${{ inputs.mode || 'keyword' }}" \
            --json-out out/result.json \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: 수집 결과 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-result
          path: out/
          if-no-files-found: ignore
          retention-days: 14
