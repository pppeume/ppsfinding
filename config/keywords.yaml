# 키워드 사전
#
# 동작 방식
#   1) search_terms  : API 의 공고명 부분일치 파라미터로 실제 조회할 검색어 (서버 측 1차 필터)
#   2) terms         : 수집된 공고명/수요기관 문자열에 대해 로컬에서 재판정 (2차 필터 + 점수화)
#   3) exclude       : 축별 오탐 제외어. 하나라도 걸리면 그 축은 매칭에서 제외
#   4) exclude_global: 전역 제외어. 하나라도 걸리면 공고 자체를 버림
#
# 점수 규칙
#   - terms 의 각 항목은 최초 1회만 가산 (같은 단어가 여러 번 나와도 중복 가산 없음)
#   - 축(axis) 점수 = 그 축에서 매칭된 term weight 합
#   - 공고 총점 = 매칭된 모든 축 점수의 합
#   - 총점이 min_score 미만이면 적재하지 않음

min_score: 3

# 어느 축에도 걸리지 않았지만 총점만 넘긴 경우를 막기 위한 최소 축 개수
min_axes: 1

# 전역 제외어: 키워드 약어 오탐(조류인플루엔자 AI, FM 라디오 등)과 무관 업종
exclude_global:
  - 조류인플루엔자
  - 고병원성
  - 살처분
  - 구제역
  - 급식
  - 청소용역
  - 경비용역
  - 제초
  - 방역소독

axes:
  - id: IoT
    search_terms: [IoT, 사물인터넷, 스마트센서]
    terms:
      - {pattern: '사물인터넷', weight: 4}
      - {pattern: 'IoT', weight: 4, regex: '(?<![A-Za-z])IoT(?![A-Za-z])', ignore_case: true}
      - {pattern: '스마트센서', weight: 3}
      - {pattern: '무선센서', weight: 2}
      - {pattern: 'LoRa', weight: 2, regex: '(?<![A-Za-z])LoRa(?![A-Za-z])', ignore_case: true}
      - {pattern: 'NB-IoT', weight: 3}
      - {pattern: '센서', weight: 1}
    exclude: []

  - id: BEMS
    search_terms: [BEMS, 건물에너지, 에너지관리시스템, FEMS]
    terms:
      - {pattern: 'BEMS', weight: 5}
      - {pattern: 'FEMS', weight: 4}
      - {pattern: '건물에너지관리', weight: 5}
      - {pattern: '건물에너지', weight: 4}
      - {pattern: '에너지관리시스템', weight: 4}
      - {pattern: 'EMS', weight: 2, regex: '(?<![A-Za-z])EMS(?![A-Za-z])'}
    exclude: [응급, 구급, 소방출동]

  - id: FM용역
    search_terms: [시설관리, 시설물관리, 종합관리용역, 건물관리]
    terms:
      - {pattern: '시설관리', weight: 4}
      - {pattern: '시설물관리', weight: 4}
      - {pattern: '종합관리용역', weight: 4}
      - {pattern: '건물관리', weight: 3}
      - {pattern: '유지관리', weight: 2}
      - {pattern: '위탁운영', weight: 2}
      - {pattern: 'FM', weight: 2, regex: '(?<![A-Za-z])FM(?![A-Za-z])'}
    exclude: [FM라디오, 주파수, 방송국, 라디오방송]

  - id: 통합관제
    search_terms: [통합관제, 관제센터, 관제시스템, 통합플랫폼]
    terms:
      - {pattern: '통합관제', weight: 5}
      - {pattern: '관제센터', weight: 4}
      - {pattern: '관제시스템', weight: 4}
      - {pattern: '스마트관제', weight: 4}
      - {pattern: '통합플랫폼', weight: 3}
      - {pattern: '모니터링시스템', weight: 2}
      - {pattern: '관제', weight: 1}
    exclude: [항공관제, 해상관제, 교통관제센터]

  - id: 에너지
    search_terms: [에너지, 에너지진단, ESCO, 신재생, 태양광]
    terms:
      - {pattern: '에너지진단', weight: 5}
      - {pattern: '에너지절감', weight: 4}
      - {pattern: '에너지효율', weight: 4}
      - {pattern: 'ESCO', weight: 4}
      - {pattern: '신재생', weight: 3}
      - {pattern: '태양광', weight: 3}
      - {pattern: '열원', weight: 2}
      - {pattern: '에너지', weight: 1}
    exclude: [에너지바우처, 연료비지원]

  - id: AI
    search_terms: [인공지능, AI, 지능형]
    terms:
      - {pattern: '인공지능', weight: 4}
      - {pattern: 'AI', weight: 3, regex: '(?<![A-Za-z])AI(?![A-Za-z])'}
      - {pattern: '머신러닝', weight: 3}
      - {pattern: '딥러닝', weight: 3}
      - {pattern: '지능형', weight: 2}
      - {pattern: '디지털트윈', weight: 2}
    exclude: [조류인플루엔자, AI방역, 가금]
