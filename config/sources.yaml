# 조달청(나라장터) OpenAPI 소스 정의
#
# [중요] 이 파일의 path / 파라미터 조합은 공공데이터포털 문서 원문을 직접 열어
# 확인하지 못한 상태로 작성된 "후보(candidate)" 입니다.
#   - 근거: 공공데이터포털 「조달청_나라장터 입찰공고정보서비스」(데이터 15129394)
#           https://www.data.go.kr/data/15129394/openapi.do
#   - 각 업무구분(물품/용역/공사/외자)마다 오퍼레이션이 분리되어 있고,
#     업무구분에 맞는 오퍼레이션을 호출해야 정상 응답이 옵니다.
#
# 따라서 각 source 는 variants 목록을 가지며, 클라이언트가 순서대로 호출해 보고
# 최초로 정상 응답(resultCode == 00)을 준 variant 를 그 실행 동안 사용합니다.
# `python -m g2b_watch.cli probe` 로 어떤 variant 가 살아있는지 먼저 확인하세요.

api:
  base: "https://apis.data.go.kr/1230000"
  timeout_sec: 30
  retries: 3
  backoff_sec: 2.0
  num_of_rows: 100
  max_pages: 20
  # data.go.kr 는 초당 호출 제한이 명시돼 있지 않으나, 과도한 연속 호출을 피하기 위한 간격
  sleep_between_calls_sec: 0.3

defaults:
  keyword_param: bidNtceNm
  date_params:
    begin: inqryBgnDt
    end: inqryEndDt
    fmt: "%Y%m%d%H%M"

sources:
  - id: bid_thng
    label: "물품"
    kind: bid
    enabled: true
    fixed_params:
      inqryDiv: "1"        # 1 = 공고게시일시 기준 조회
    variants:
      - path: "ad/BidPublicInfoService/getBidPblancListInfoThngPPSSrch"
      - path: "ao/BidPublicInfoService/getBidPblancListInfoThngPPSSrch"
      - path: "ad/BidPublicInfoService04/getBidPblancListInfoThngPPSSrch"
      - path: "BidPublicInfoService04/getBidPblancListInfoThngPPSSrch"
      - path: "ad/BidPublicInfoService/getBidPblancListInfoThng"
      - path: "ao/BidPublicInfoService/getBidPblancListInfoThng"

  - id: bid_servc
    label: "용역"
    kind: bid
    enabled: true
    fixed_params:
      inqryDiv: "1"
    variants:
      - path: "ad/BidPublicInfoService/getBidPblancListInfoServcPPSSrch"
      - path: "ao/BidPublicInfoService/getBidPblancListInfoServcPPSSrch"
      - path: "ad/BidPublicInfoService04/getBidPblancListInfoServcPPSSrch"
      - path: "BidPublicInfoService04/getBidPblancListInfoServcPPSSrch"
      - path: "ad/BidPublicInfoService/getBidPblancListInfoServc"
      - path: "ao/BidPublicInfoService/getBidPblancListInfoServc"

  # 사전규격(발주예고) — 「조달청_나라장터 사전규격정보서비스」
  # 오퍼레이션명/파라미터는 미검증. probe 로 확정 후 불필요한 variant 를 지우세요.
  - id: prestd_thng
    label: "사전규격"
    kind: prestd
    enabled: true
    keyword_param: prdctClsfcNoNm
    fixed_params:
      inqryDiv: "1"
    variants:
      - path: "ao/HrcspSsstndrdInfoService/getPublicPrcureThngInfoThng"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "as/HrcspSsstndrdInfoService/getPublicPrcureThngInfoThng"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "HrcspSsstndrdInfoService/getPublicPrcureThngInfoThng"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "ao/HrcspSsstndrdInfoService/getPublicPrcureThngInfoThng"
        date_params: {begin: inqryBgnDt, end: inqryEndDt, fmt: "%Y%m%d%H%M"}

  - id: prestd_servc
    label: "사전규격"
    kind: prestd
    enabled: true
    keyword_param: prdctClsfcNoNm
    fixed_params:
      inqryDiv: "1"
    variants:
      - path: "ao/HrcspSsstndrdInfoService/getPublicPrcureThngInfoServc"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "as/HrcspSsstndrdInfoService/getPublicPrcureThngInfoServc"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "HrcspSsstndrdInfoService/getPublicPrcureThngInfoServc"
        date_params: {begin: inqryBgnDate, end: inqryEndDate, fmt: "%Y%m%d"}
      - path: "ao/HrcspSsstndrdInfoService/getPublicPrcureThngInfoServc"
        date_params: {begin: inqryBgnDt, end: inqryEndDt, fmt: "%Y%m%d%H%M"}
